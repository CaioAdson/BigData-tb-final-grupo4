# Infraestrutura base (Kafka KRaft, Elasticsearch, Redis, OpenLDAP) + API.
# Modo desenvolvimento: Kafka/Elasticsearch em PLAINTEXT, so localhost.
# Seguranca completa (Kerberos SASL/GSSAPI no Kafka + SPNEGO no Elasticsearch):
#   docker compose -f docker-compose.yml -f docker-compose.kerberos.yml up -d   (ver docs/SEGURANCA.md)

name: enade-search

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: enade-kafka
    ports:
      - "29092:29092"   # acesso do host (producer/consumer rodando fora do Docker)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: enade-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        B=kafka:9092
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$B --create --if-not-exists \
          --topic ${KAFKA_TOPIC_QUESTOES} --partitions ${KAFKA_PARTITIONS_QUESTOES} --replication-factor 1 \
          --config retention.ms=-1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$B --create --if-not-exists \
          --topic ${KAFKA_TOPIC_DLQ} --partitions ${KAFKA_PARTITIONS_DLQ} --replication-factor 1 \
          --config retention.ms=-1
        echo "Topicos criados:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$B --list

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    container_name: enade-elasticsearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"   # sera habilitado com Kerberos na semana 4
      ES_JAVA_OPTS: ${ES_JAVA_OPTS}
      cluster.name: enade-cluster
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -Eq '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION}
    container_name: enade-kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    container_name: enade-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis-insight:
    image: redis/redisinsight:latest
    container_name: enade-redis-insight
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - redisinsight-data:/data

  # ---- Pipeline de ingestao (semana 2). Perfil "pipeline": nao sobe com 'docker compose up' puro.
  consumidor:
    build: ./ingestao
    container_name: enade-consumidor
    profiles: ["pipeline"]
    command: ["python", "-m", "enade.consumidor"]
    environment: &pipeline-env
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC_QUESTOES: ${KAFKA_TOPIC_QUESTOES}
      KAFKA_TOPIC_DLQ: ${KAFKA_TOPIC_DLQ}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-enade-indexador}
      ES_URL: http://elasticsearch:9200
      ES_INDEX: ${ES_INDEX:-enade-questoes}
      ES_SHARDS: ${ES_SHARDS:-3}
      ES_REPLICAS: ${ES_REPLICAS:-0}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  produtor:
    build: ./ingestao
    container_name: enade-produtor
    profiles: ["pipeline"]
    entrypoint: ["python", "-m", "enade.produtor"]
    command: ["--manifest", "/data/manifest.csv"]
    environment: *pipeline-env
    volumes:
      - ./data:/data:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: "no"

  # ---- Autenticacao de usuarios (LDAP). Perfis = grupos cn=professores / cn=estudantes.
  ldap:
    image: osixia/openldap:1.5.0
    container_name: enade-ldap
    hostname: ldap
    ports:
      - "389:389"
    environment:
      LDAP_ORGANISATION: ENADE Search
      LDAP_DOMAIN: enade.local
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      LDAP_READONLY_USER: "true"          # conta de servico somente leitura usada pela API
      LDAP_READONLY_USER_USERNAME: leitura
      LDAP_READONLY_USER_PASSWORD: ${LDAP_BIND_PASSWORD}
      LDAP_TLS: "false"                   # laboratorio; em producao use LDAPS/StartTLS
    volumes:
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost -b dc=enade,dc=local -D cn=admin,dc=enade,dc=local -w \"$$LDAP_ADMIN_PASSWORD\" -s base > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  ldap-init:
    image: osixia/openldap:1.5.0
    container_name: enade-ldap-init
    restart: "no"
    entrypoint: ["bash", "/seed/seed.sh"]
    environment:
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      LDAP_SENHA_PROFESSOR_DEMO: ${LDAP_SENHA_PROFESSOR_DEMO}
      LDAP_SENHA_ESTUDANTE_DEMO: ${LDAP_SENHA_ESTUDANTE_DEMO}
    volumes:
      - ./infra/ldap:/seed:ro
    depends_on:
      ldap:
        condition: service_healthy

  api:
    build: ./api
    container_name: enade-api
    ports:
      - "8001:8000"
    environment:
      ES_URL: http://elasticsearch:9200
      ES_INDEX: ${ES_INDEX:-enade-questoes}
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CACHE_TTL: ${CACHE_TTL:-300}
      SESSAO_TTL: ${SESSAO_TTL:-3600}
      CARRINHO_MAX: ${CARRINHO_MAX:-100}
      LDAP_URL: ldap://ldap:389
      LDAP_BIND_DN: cn=leitura,dc=enade,dc=local
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD}
      CORS_ORIGENS: ${CORS_ORIGENS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      ldap:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kafka-data:
  es-data:
  redis-data:
  redisinsight-data:
  ldap-data:
  ldap-config:



