// Broker: aceita clientes SASL/GSSAPI como kafka/kafka@ENADE.LOCAL
KafkaServer {
  com.sun.security.auth.module.Krb5LoginModule required
  useKeyTab=true storeKey=true useTicketCache=false
  keyTab="/keytabs/kafka.keytab"
  principal="kafka/kafka@ENADE.LOCAL";
};
// Ferramentas de linha de comando (criacao de topicos, healthcheck)
KafkaClient {
  com.sun.security.auth.module.Krb5LoginModule required
  useKeyTab=true storeKey=true useTicketCache=false
  keyTab="/keytabs/kafka-admin.keytab"
  principal="kafka-admin@ENADE.LOCAL";
};
