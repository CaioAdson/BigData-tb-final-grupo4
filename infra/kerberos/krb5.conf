# Configuracao Kerberos compartilhada por KDC, Kafka, Elasticsearch, API e pipeline.
[libdefaults]
  default_realm = ENADE.LOCAL
  dns_lookup_realm = false
  dns_lookup_kdc = false
  rdns = false
  dns_canonicalize_hostname = false
  udp_preference_limit = 1
  forwardable = true
  ticket_lifetime = 24h
  renew_lifetime = 7d

[realms]
  ENADE.LOCAL = {
    kdc = kdc:88
    admin_server = kdc:749
  }

[domain_realm]
  kafka = ENADE.LOCAL
  elasticsearch = ENADE.LOCAL
